<!DOCTYPE html>
<html>
<head>
    <title>10th Marksheet</title>
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .container { width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 8px #bbb; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #888; padding: 8px; text-align: center; }
        caption { font-size: 1.2em; font-weight: bold; margin-bottom: 8px; }
        input[type=text] { width: 70px; padding: 5px; }
        .btn { padding: 10px 18px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
</html>
